services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aireel
      MYSQL_USER: aireel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in backend/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api: &backend
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://aireel:${MYSQL_PASSWORD}@mysql:3306/aireel?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      EXAMPLE_DIR: /app/example-assets
      TEMPLATE_DIR: /app/template-assets
      HITS_BASE_URL: ${HITS_BASE_URL:-http://43.143.146.27}
      HITS_CALLBACK_URL: ${HITS_CALLBACK_URL:-http://49.233.86.246/api/auth/hits/callback}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./workflows:/app/workflows:ro
      - upload_data:/app/storage/uploads
      - ../public/sites/aibox/video-examples:/app/example-assets:ro
      - ../public/sites/aibox/templates:/app/template-assets:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 5m
    ports: []
    depends_on:
      api: {condition: service_healthy}
volumes:
  mysql_data:
  upload_data:
