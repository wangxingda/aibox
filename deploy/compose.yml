name: aibox
services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aibox
      MYSQL_USER: aibox
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api: &api
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://aibox:${MYSQL_PASSWORD}@mysql:3306/aibox?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      EXAMPLE_DIR: /app/example-assets
      TEMPLATE_DIR: /app/template-assets
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      COMFYUI_URL: ${COMFYUI_URL:?Set COMFYUI_URL}
      COMFYUI_TOKEN: ${COMFYUI_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      HITS_BASE_URL: ${HITS_BASE_URL:-https://idiandian.xyz}
      HITS_CLIENT_ID: ${HITS_CLIENT_ID:-aibox}
      HITS_CLIENT_SECRET: ${HITS_CLIENT_SECRET:-aibox-hits-public-test-default-key-2026}
      HITS_CALLBACK_URL: ${HITS_CALLBACK_URL:-https://aibox.idiandian.xyz/api/auth/hits/callback}
    volumes:
      - upload_data:/app/storage/uploads
      - ../public/sites/aibox/video-examples:/app/example-assets:ro
      - ../public/sites/aibox/templates:/app/template-assets:ro
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *api
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 5m
    healthcheck:
      disable: true
    depends_on:
      api: {condition: service_healthy}
  frontend:
    environment:
      BACKEND_URL: http://api:8000
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  nginx:
    image: docker.m.daocloud.io/library/nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AIBOX_TLS_DIR:-../../ssl}:/etc/nginx/tls:ro
    depends_on:
      - frontend
      - api
volumes:
  mysql_data:
  upload_data:
